services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - '16686:16686'
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./opentelemetry-collector.config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - jaeger
    networks:
      - backend
