name: acme-e2e

services:
  mysql:
    image: mysql:9.7.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme_db
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:8.10.3-alpine
    command: redis-server --requirepass e2e-redis-password
    environment:
      REDISCLI_AUTH: e2e-redis-password
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  node:
    build:
      context: ../..
      dockerfile: docker-compose/test/docker/Dockerfile.node
    command: sh -c "yarn migration:run && yarn test:e2e:seed"
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/acme_db
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
