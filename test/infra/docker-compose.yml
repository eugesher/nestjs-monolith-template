name: acme-e2e

services:
  mysql:
    image: mysql:9.7.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme_db
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:8.10.3-alpine
    command: redis-server --requirepass e2e-redis-password
    environment:
      REDISCLI_AUTH: e2e-redis-password
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - '16687:16686'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel-collector.config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4319:4317'
      - '4320:4318'
    depends_on:
      - jaeger

  node:
    build:
      context: ../..
      dockerfile: test/infra/docker/Dockerfile.node
    command: sh -c "yarn migration:run && yarn test:e2e:seed"
    network_mode: host
    env_file: ../../env/migrations/.env.test
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
