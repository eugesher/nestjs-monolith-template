name: 01-assign
description: |-
  e2e: Iam › POST /api/iam/users/:userId/roles › should grant a role and answer 200

  Expect: 200 OK, roles viewer and editor
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/iam/users/00000000-0000-4000-8000-000000000004/roles
body:
  content: |-
    {
      "role": "editor"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
