name: 01-register
description: |-
  e2e: Iam › POST /api/iam/users › should create a user who can log in at once

  Expect: 201 Created, a user row with an argon2id hash and the viewer role; the new credentials log in with 200
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/iam/users
body:
  content: |-
    {
      "email": "new-viewer@example.com",
      "password": "new-viewer-password-please-change",
      "roles": [
        "viewer"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
