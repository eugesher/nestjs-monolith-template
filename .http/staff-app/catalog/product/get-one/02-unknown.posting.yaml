name: 02-unknown
description: |-
  e2e: Catalog › Product › GET /api/catalog/products/:productId › should answer an unknown product with 404

  Expect: 404 Not Found, code PRODUCT_NOT_FOUND
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/catalog/products/999
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
