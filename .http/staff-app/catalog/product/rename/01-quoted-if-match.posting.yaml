name: 01-quoted-if-match
description: |-
  e2e: Catalog › Product › PATCH /api/catalog/products/:productId/name › should rename with a quoted If-Match and bump the version

  Expect: 200 OK, product 102 renamed at version 2
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/catalog/products/102/name
body:
  content: |-
    {
      "name": "Renamed product"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '"1"'
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
