name: 02-replay
description: |-
  e2e: Catalog › Product › POST /api/catalog/products › should replay the same response for the same key and body without a second product

  Expect: 201 Created both times with the same body, one product, one ledger entry
  User: editor@example.com (token signed by scripts.py)
  Note: send it twice
method: POST
url: $STAFF_APP_BASE_URL/catalog/products
body:
  content: |-
    {
      "sku": "E2E-0002",
      "name": "Replayed product"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-replay-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
