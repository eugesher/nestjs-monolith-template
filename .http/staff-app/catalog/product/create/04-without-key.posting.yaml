name: 04-without-key
description: |-
  e2e: Catalog › Product › POST /api/catalog/products › should refuse a create without a key with 400

  Expect: 400 Bad Request, code IDEMPOTENCY_KEY_REQUIRED, no product
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/catalog/products
body:
  content: |-
    {
      "sku": "E2E-0005",
      "name": "Refused product"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
