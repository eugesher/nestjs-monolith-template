name: 03-archived
description: |-
  e2e: Catalog › Product › PUT /api/catalog/products/:productId/publish › should refuse to publish an archived product with 409

  Expect: 409 Conflict, code PRODUCT_ALREADY_ARCHIVED, no ledger record
  User: editor@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/catalog/products/105/publish
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
