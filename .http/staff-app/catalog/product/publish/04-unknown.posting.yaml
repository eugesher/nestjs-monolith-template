name: 04-unknown
description: |-
  e2e: Catalog › Product › PUT /api/catalog/products/:productId/publish › should answer 404 for an unknown product

  Expect: 404 Not Found, code PRODUCT_NOT_FOUND
  User: editor@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/catalog/products/999/publish
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
