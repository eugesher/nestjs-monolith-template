name: 03-republish
description: |-
  e2e: Catalog › Product › PUT /api/catalog/products/:productId/publish › should publish an archived product again under a ledger record of its new version

  Expect: 200 OK, product 105 active at version 3, a ledger record product-published:105:3 with correlation_id e2e-product-republish
  User: editor@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/catalog/products/105/publish
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: x-correlation-id
    value: e2e-product-republish
scripts:
  setup: scripts.py:as_editor
