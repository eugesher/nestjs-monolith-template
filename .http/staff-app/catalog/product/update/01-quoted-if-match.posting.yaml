name: 01-quoted-if-match
description: |-
  e2e: Catalog › Product › PATCH /api/catalog/products/:productId › should update the name with a quoted If-Match, bump the version and drop the cached customer catalog

  Expect: 200 OK, product 102 renamed at version 2; no acme:catalog:* key left
  User: editor@example.com (token signed by scripts.py)
  Before: Redis: SET acme:catalog:v1:page:1:size:20 '{}'
method: PATCH
url: $STAFF_APP_BASE_URL/catalog/products/102
body:
  content: |-
    {
      "name": "Renamed product"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '"1"'
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
