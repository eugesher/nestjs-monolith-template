name: 04-malformed-if-match
description: |-
  e2e: Catalog › Product › PATCH /api/catalog/products/:productId › should refuse a malformed If-Match with 400

  Expect: 400 Bad Request, code IF_MATCH_INVALID
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/catalog/products/101
body:
  content: |-
    {
      "name": "Malformed rename"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: not-a-number
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
