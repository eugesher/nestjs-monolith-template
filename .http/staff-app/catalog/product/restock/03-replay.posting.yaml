name: 03-replay
description: |-
  e2e: Catalog › Product › POST /api/catalog/products/:productId/stock › should replay the same response for the same key and body without a second movement

  Expect: 201 Created both times with the same body, product 100 at 10 units, one +2 row
  User: editor@example.com (token signed by scripts.py)
  Note: send it twice
method: POST
url: $STAFF_APP_BASE_URL/catalog/products/100/stock
body:
  content: |-
    {
      "quantity": 2
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-restock-replay-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
