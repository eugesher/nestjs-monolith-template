name: 09-fraction
description: |-
  e2e: Catalog › Product › POST /api/catalog/products/:productId/stock › should refuse a quantity of a fraction with 400 from validation

  Expect: 400 Bad Request, quantity must be an integer number
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/catalog/products/100/stock
body:
  content: |-
    {
      "quantity": 2.5
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-restock-invalid-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
