name: 01-all-customers
description: |-
  e2e: Order › GET /api/orders › should list the orders of every customer, newest first

  Expect: 200 OK, orders 601 and 600 of two customers
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/orders
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
