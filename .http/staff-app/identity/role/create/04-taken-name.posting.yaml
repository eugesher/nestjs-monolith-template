name: 04-taken-name
description: |-
  e2e: Identity › Role › POST /api/identity/roles › should refuse a taken name with 409

  Expect: 409 Conflict, code AUTH_ROLE_NAME_TAKEN
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/identity/roles
body:
  content: |-
    { "name": "admin", "permissionCodes": [] }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
