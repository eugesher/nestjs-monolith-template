name: 05-without-identity-permission-assign
description: |-
  e2e: Identity › Role › POST /api/identity/roles › should refuse a caller without identity:permission:assign

  Expect: 403 Forbidden, Insufficient permissions
  User: viewer@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/identity/roles
body:
  content: |-
    { "name": "auditor", "permissionCodes": [] }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_viewer
