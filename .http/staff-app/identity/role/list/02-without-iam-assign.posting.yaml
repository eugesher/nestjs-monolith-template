name: 02-without-iam-assign
description: |-
  e2e: Identity › Role › GET /api/identity/roles › should refuse a caller without iam:assign

  Expect: 403 Forbidden, Insufficient permissions
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/identity/roles
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
