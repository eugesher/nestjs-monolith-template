name: 03-unknown-role
description: |-
  e2e: Identity › Role › PUT /api/identity/roles/:role/permissions › should answer 404 for an unknown role

  Expect: 404 Not Found, code AUTH_ROLE_NOT_FOUND
  User: admin@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/identity/roles/auditor/permissions
body:
  content: |-
    {
      "permissionCodes": [
        "ledger:read"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
