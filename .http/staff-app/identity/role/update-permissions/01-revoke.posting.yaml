name: 01-revoke
description: |-
  e2e: Identity › Role › PUT /api/identity/roles/:role/permissions › should replace the permissions and refuse the same token at once

  Expect: 200 OK, viewer holds product:write instead of ledger:read; the same viewer token gets 200 from GET /ledger before and 403 after
  User: admin@example.com (token signed by scripts.py)
  After: SQL: DELETE FROM staff_role_permissions WHERE role_id = 3; INSERT INTO staff_role_permissions (role_id, permission_id) VALUES (3, 1), (3, 7), (3, 10)
method: PUT
url: $STAFF_APP_BASE_URL/identity/roles/viewer/permissions
body:
  content: |-
    {
      "permissionCodes": [
        "product:write"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
