name: 01-permissions
description: |-
  e2e: Identity › Permission › GET /api/identity/permissions › should list every permission code

  Expect: 200 OK, every permission code
  User: admin@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/identity/permissions
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
