name: 05-customer-app-secret
description: |-
  e2e: Identity › Auth › GET /api/identity/auth/me › should refuse the token of a staff user signed with the secret of customer-app

  Expect: 401 Unauthorized
  User: editor@example.com (token signed by scripts.py with the JWT_SECRET of customer-app)
url: $STAFF_APP_BASE_URL/identity/auth/me
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor_with_customer_secret
