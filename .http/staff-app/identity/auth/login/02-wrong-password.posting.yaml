name: 02-wrong-password
description: |-
  e2e: Identity › Auth › POST /api/identity/auth/login › should refuse a wrong password with the same 401

  Expect: 401 Unauthorized, code AUTH_INVALID_CREDENTIALS
method: POST
url: $STAFF_APP_BASE_URL/identity/auth/login
body:
  content: |-
    {
      "email": "editor@example.com",
      "password": "wrong-password-123"
    }
headers:
  - name: Content-Type
    value: application/json
