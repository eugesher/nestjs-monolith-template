name: 02-unknown-user
description: |-
  e2e: Identity › User › POST /api/identity/users/:userId/roles › should answer 404 for an unknown user

  Expect: 404 Not Found, code AUTH_USER_NOT_FOUND
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/identity/users/00000000-0000-4000-8000-000000000099/roles
body:
  content: |-
    {
      "role": "editor"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
