name: 03-taken-email
description: |-
  e2e: Identity › User › POST /api/identity/users › should refuse a taken email in another case with 409

  Expect: 409 Conflict, code AUTH_EMAIL_TAKEN, no new user
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/identity/users
body:
  content: |-
    {
      "email": "EDITOR@example.com",
      "password": "another-password-please-change",
      "roles": [
        "viewer"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
