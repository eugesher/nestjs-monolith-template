name: 06-customer-audience
description: |-
  e2e: Auth › GET /api/auth/me › should refuse the token of a staff user issued for the customer audience

  Expect: 401 Unauthorized
  User: editor@example.com (token signed by scripts.py with the JWT_SECRET of this app and aud customer)
url: $STAFF_APP_BASE_URL/auth/me
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor_for_customer_audience
