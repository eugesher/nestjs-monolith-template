name: 04-customer
description: |-
  e2e: Auth › GET /api/auth/me › should refuse the token of a customer signed with the secret of this app

  Expect: 401 Unauthorized
  User: customer ann@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/auth/me
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_customer
