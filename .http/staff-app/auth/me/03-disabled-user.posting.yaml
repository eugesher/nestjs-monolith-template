name: 03-disabled-user
description: |-
  e2e: Auth › GET /api/auth/me › should refuse the token of a disabled user

  Expect: 401 Unauthorized
  User: disabled@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/auth/me
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_disabled
