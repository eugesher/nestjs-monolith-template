name: 01-revisions
description: |-
  e2e: Tools › Note › GET /api/tools/notes/:noteId/revisions › should list the revisions of a note

  Expect: 200 OK, revision 200 of note 202
  User: admin@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/tools/notes/202/revisions
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
