name: 04-id-not-number
description: |-
  e2e: Tools › Note › GET /api/tools/notes/:noteId › should refuse an id that is not a number with 400 from validation

  Expect: 400 Bad Request, noteId must be a positive integer
  User: admin@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/tools/notes/abc
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
