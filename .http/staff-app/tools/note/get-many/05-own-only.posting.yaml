name: 05-own-only
description: |-
  e2e: Tools › Note › GET /api/tools/notes › should list only the notes of the caller, with no permission needed

  Expect: 200 OK, an empty page: viewer holds no note permission and owns no note
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/tools/notes
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
