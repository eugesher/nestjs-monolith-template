name: 04-resolved-not-boolean
description: |-
  e2e: Tools › Note › GET /api/tools/notes › should refuse a resolution that is not a boolean with 400 from validation

  Expect: 400 Bad Request, resolved must be a boolean value
  User: admin@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/tools/notes
params:
  - name: resolved
    value: 'yes'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
