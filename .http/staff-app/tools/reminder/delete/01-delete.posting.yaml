name: 01-delete
description: |-
  e2e: Tools › Reminder › DELETE /api/tools/reminders/:reminderId › should soft-delete a reminder and drop the cached summary

  Expect: 204 No Content, reminder 304 gets deleted_at; the summary key is gone
  User: admin@example.com (token signed by scripts.py)
  Before: Redis: DEL every acme:* key
  Before: send tools/reminder/get-summary/01-compute-and-cache
method: DELETE
url: $STAFF_APP_BASE_URL/tools/reminders/304
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
