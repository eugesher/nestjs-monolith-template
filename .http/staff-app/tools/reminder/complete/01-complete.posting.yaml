name: 01-complete
description: |-
  e2e: Tools › Reminder › PATCH /api/tools/reminders/:reminderId/done › should complete a reminder and drop the cached summary

  Expect: 200 OK, reminder 301 done at version 2; the summary key is gone
  User: admin@example.com (token signed by scripts.py)
  Before: Redis: DEL every acme:* key
  Before: send tools/reminder/get-summary/01-compute-and-cache
method: PATCH
url: $STAFF_APP_BASE_URL/tools/reminders/301/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
