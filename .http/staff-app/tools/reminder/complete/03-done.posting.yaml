name: 03-done
description: |-
  e2e: Tools › Reminder › PATCH /api/tools/reminders/:reminderId/done › should refuse a done reminder with 409

  Expect: 409 Conflict, code REMINDER_ALREADY_DONE
  User: admin@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/tools/reminders/302/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
