name: 05-id-not-number
description: |-
  e2e: Tools › Reminder › PATCH /api/tools/reminders/:reminderId/done › should refuse an id that is not a number with 400 from validation

  Expect: 400 Bad Request, reminderId must be a positive integer
  User: admin@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/tools/reminders/abc/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
