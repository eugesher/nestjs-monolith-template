name: 01-compute-and-cache
description: |-
  e2e: Tools › Reminder › GET /api/tools/reminders/summary › should compute the summary of the caller and cache it

  Expect: 200 OK, pending 4, nextDueOn 2026-05-15; key acme:reminders:summary:v1:1:__all__ cached for 60 s
  User: admin@example.com (token signed by scripts.py)
  Before: Redis: DEL every acme:* key
url: $STAFF_APP_BASE_URL/tools/reminders/summary
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
