name: 02-resolved
description: |-
  e2e: Note › PATCH /api/notes/:noteId/resolve › should refuse to resolve a resolved note with 409

  Expect: 409 Conflict, code NOTE_RESOLVED
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/notes/202/resolve
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
