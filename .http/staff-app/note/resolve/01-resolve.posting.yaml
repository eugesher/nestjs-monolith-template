name: 01-resolve
description: |-
  e2e: Note › PATCH /api/notes/:noteId/resolve › should resolve a note

  Expect: 200 OK, note 201 resolved at version 2
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/notes/201/resolve
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
