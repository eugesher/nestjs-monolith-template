name: 03-foreign
description: |-
  e2e: Note › GET /api/notes/:noteId/revisions › should hide the revisions of a note of another staff user with 404

  Expect: 404 Not Found, code NOTE_NOT_FOUND
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/notes/202/revisions
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
