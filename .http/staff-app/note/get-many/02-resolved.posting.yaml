name: 02-resolved
description: |-
  e2e: Note › GET /api/notes › should filter by resolution

  Expect: 200 OK, note 202
  User: editor@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/notes
params:
  - name: resolved
    value: 'true'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
