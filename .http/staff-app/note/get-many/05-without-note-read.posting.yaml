name: 05-without-note-read
description: |-
  e2e: Note › GET /api/notes › should refuse a caller without note:read

  Expect: 403 Forbidden, Insufficient permissions
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/notes
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
