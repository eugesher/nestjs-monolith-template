name: 03-malformed-id
description: |-
  e2e: Sales › Order › GET /api/sales/orders/:orderId › should refuse a malformed order id with 400 from validation

  Expect: 400 Bad Request, orderId must be a positive integer
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/sales/orders/abc
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
