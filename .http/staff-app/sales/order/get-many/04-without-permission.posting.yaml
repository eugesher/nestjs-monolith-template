name: 04-without-permission
description: |-
  e2e: Sales › Order › GET /api/sales/orders › should refuse a role without order:read with 403

  Expect: 403 Forbidden
  User: viewer@example.com (token signed by scripts.py)
  Before: SQL: DELETE FROM staff_role_permissions WHERE role_id = 3 AND code = 'order:read'
  After: SQL: INSERT INTO staff_role_permissions (role_id, code) VALUES (3, 'order:read')
url: $STAFF_APP_BASE_URL/sales/orders
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
