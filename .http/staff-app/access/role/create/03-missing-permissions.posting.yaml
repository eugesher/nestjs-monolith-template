name: 03-missing-permissions
description: |-
  e2e: Access › Role › POST /api/access/roles › should refuse a missing permission list with 400

  Expect: 400 Bad Request
  User: admin@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/access/roles
body:
  content: |-
    { "name": "auditor" }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
