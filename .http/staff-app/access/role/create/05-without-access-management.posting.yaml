name: 05-without-access-management
description: |-
  e2e: Access › Role › POST /api/access/roles › should refuse a caller without access-management

  Expect: 403 Forbidden, Insufficient permissions
  User: viewer@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/access/roles
body:
  content: |-
    { "name": "auditor", "permissionCodes": [] }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_viewer
