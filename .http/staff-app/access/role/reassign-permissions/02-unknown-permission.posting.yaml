name: 02-unknown-permission
description: |-
  e2e: Access › Role › PUT /api/access/roles/:roleId/permissions › should refuse an unknown permission code with 400

  Expect: 400 Bad Request from validation, permissions unchanged
  User: admin@example.com (token signed by scripts.py)
method: PUT
url: $STAFF_APP_BASE_URL/access/roles/3/permissions
body:
  content: |-
    {
      "permissionCodes": [
        "ledger:read",
        "ledger:delete"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
