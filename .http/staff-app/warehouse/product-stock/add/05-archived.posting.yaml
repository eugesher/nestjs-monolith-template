name: 05-archived
description: |-
  e2e: Warehouse › ProductStock › POST /api/warehouse/product-stock/:productId/add › should restock an archived product and leave it archived

  Expect: 201 Created, product 105 at 9 units and still archived at version 2, a ProductRestocked ledger record
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/warehouse/product-stock/105/add
body:
  content: |-
    {
      "quantity": 5
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-restock-archived-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
