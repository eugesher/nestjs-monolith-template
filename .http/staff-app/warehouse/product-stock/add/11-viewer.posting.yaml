name: 11-viewer
description: |-
  e2e: Warehouse › ProductStock › POST /api/warehouse/product-stock/:productId/add › should refuse a restock by a viewer with 403

  Expect: 403 Forbidden
  User: viewer@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/warehouse/product-stock/100/add
body:
  content: |-
    {
      "quantity": 5
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-restock-viewer-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_viewer
