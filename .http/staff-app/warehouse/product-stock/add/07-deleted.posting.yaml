name: 07-deleted
description: |-
  e2e: Warehouse › ProductStock › POST /api/warehouse/product-stock/:productId/add › should answer a deleted product with 404

  Expect: 404 Not Found, code PRODUCT_NOT_FOUND
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/warehouse/product-stock/107/add
body:
  content: |-
    {
      "quantity": 5
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-restock-missing-107
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
