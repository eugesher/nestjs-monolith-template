name: 10-without-key
description: |-
  e2e: Warehouse › ProductStock › POST /api/warehouse/product-stock/:productId/add › should refuse a restock without a key with 400

  Expect: 400 Bad Request, code IDEMPOTENCY_KEY_REQUIRED
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/warehouse/product-stock/100/add
body:
  content: |-
    {
      "quantity": 5
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
