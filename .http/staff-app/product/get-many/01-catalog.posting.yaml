name: 01-catalog
description: |-
  e2e: Product › GET /api/products › should list the catalog, newest first

  Expect: 200 OK, products 105 to 100
  User: viewer@example.com (token signed by scripts.py)
url: $STAFF_APP_BASE_URL/products
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
