name: 02-archived
description: |-
  e2e: Product › PATCH /api/products/:productId/archive › should refuse to archive an archived product with 409

  Expect: 409 Conflict, code PRODUCT_ALREADY_ARCHIVED, no ledger entry
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $STAFF_APP_BASE_URL/products/105/archive
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
