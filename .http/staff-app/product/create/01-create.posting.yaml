name: 01-create
description: |-
  e2e: Product › POST /api/products › should create a draft, record the key and the ledger entry under the correlation id

  Expect: 201 Created; product, a completed idempotency_key row and a ledger entry product-created with correlation_id e2e-product-create
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/products
body:
  content: |-
    {
      "sku": "E2E-0001",
      "name": "Created product"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-create-key
  - name: x-correlation-id
    value: e2e-product-create
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
