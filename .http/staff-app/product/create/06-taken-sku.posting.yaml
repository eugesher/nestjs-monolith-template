name: 06-taken-sku
description: |-
  e2e: Product › POST /api/products › should refuse a taken sku with 409 and release the key

  Expect: 409 Conflict, code PRODUCT_SKU_TAKEN, no idempotency_key row
  User: editor@example.com (token signed by scripts.py)
method: POST
url: $STAFF_APP_BASE_URL/products
body:
  content: |-
    {
      "sku": "SKU-0001",
      "name": "Taken sku"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-taken-sku-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
