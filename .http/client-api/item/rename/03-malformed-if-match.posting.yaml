name: 03-malformed-if-match
description: |-
  e2e: Item › PATCH /api/items/:itemId/name › should refuse a malformed If-Match with 400

  Expect: 400 Bad Request, code IF_MATCH_INVALID
  User: admin@example.com (token signed by scripts.py)
method: PATCH
url: $CLIENT_API_BASE_URL/items/101/name
body:
  content: |-
    {
      "name": "Malformed rename"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: not-a-number
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
