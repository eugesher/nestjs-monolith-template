name: 02-stale-if-match
description: |-
  e2e: Item › PATCH /api/items/:itemId/name › should refuse a stale If-Match with 409 and the current version

  Expect: 409 Conflict, code VERSION_MISMATCH, details.currentVersion 1
  User: admin@example.com (token signed by scripts.py)
method: PATCH
url: $CLIENT_API_BASE_URL/items/101/name
body:
  content: |-
    {
      "name": "Stale rename"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '0'
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
