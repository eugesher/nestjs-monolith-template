name: 02-replay
description: |-
  e2e: Item › POST /api/items › should replay the same response for the same key and body without a second item

  Expect: 201 Created both times with the same body, one item, one ledger entry
  User: editor@example.com (token signed by scripts.py)
  Note: send it twice
method: POST
url: $CLIENT_API_BASE_URL/items
body:
  content: |-
    {
      "sku": "E2E-0002",
      "name": "Replayed item"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-replay-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
