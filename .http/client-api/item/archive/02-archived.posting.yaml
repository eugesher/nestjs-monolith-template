name: 02-archived
description: |-
  e2e: Item › PATCH /api/items/:itemId/archive › should refuse to archive an archived item with 409

  Expect: 409 Conflict, code ITEM_ALREADY_ARCHIVED, no ledger entry
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $CLIENT_API_BASE_URL/items/105/archive
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
