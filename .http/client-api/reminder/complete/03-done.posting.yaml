name: 03-done
description: |-
  e2e: Reminder › PATCH /api/reminders/:reminderId/done › should refuse a done reminder with 409

  Expect: 409 Conflict, code REMINDER_ALREADY_DONE
  User: viewer@example.com (token signed by scripts.py)
method: PATCH
url: $CLIENT_API_BASE_URL/reminders/302/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
