name: 01-create
description: |-
  e2e: Reminder › POST /api/reminders › should create a pending reminder on the date sent and drop the cached summary

  Expect: 201 Created, dueOn 2026-06-01; the summary key is gone
  User: viewer@example.com (token signed by scripts.py)
  Before: Redis: FLUSHDB
  Before: send reminder/get-summary/01-compute-and-cache
method: POST
url: $CLIENT_API_BASE_URL/reminders
body:
  content: |-
    {
      "title": "Renew the domain",
      "dueOn": "2026-06-01"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_viewer
