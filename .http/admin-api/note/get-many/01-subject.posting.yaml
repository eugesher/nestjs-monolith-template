name: 01-subject
description: |-
  e2e: Note › GET /api/notes › should list the notes of one subject, newest first

  Expect: 200 OK, notes 201 and 200
  User: editor@example.com (token signed by scripts.py)
url: $ADMIN_API_BASE_URL/notes
params:
  - name: subjectType
    value: item
  - name: subjectId
    value: '100'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
