name: 01-roles-from-database
description: |-
  e2e: Session › GET /api/auth/me › should take the roles from the database, not from the token claims

  Expect: 200 OK, the viewer with the viewer role and permissions; with the same token GET /iam/roles answers 403
  User: viewer@example.com with admin claims in the token (token signed by scripts.py)
url: $ADMIN_API_BASE_URL/auth/me
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer_forged_claims
