name: 04-disabled-user
description: |-
  e2e: Session › POST /api/auth/login › should refuse a disabled user with 403

  Expect: 403 Forbidden, code AUTH_USER_INACTIVE
method: POST
url: $ADMIN_API_BASE_URL/auth/login
body:
  content: |-
    {
      "email": "disabled@example.com",
      "password": "disabled-password-please-change"
    }
headers:
  - name: Content-Type
    value: application/json
