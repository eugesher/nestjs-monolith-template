name: 01-own-items
description: |-
  e2e: Item › GET /api/items › should list only the own items of the caller, newest first

  Expect: 200 OK, items 101 and 100
  User: bob@example.com (token signed by scripts.py)
url: $CUSTOMER_APP_BASE_URL/items
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_bob
