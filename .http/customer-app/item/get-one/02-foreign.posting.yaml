name: 02-foreign
description: |-
  e2e: Item › GET /api/items/:itemId › should hide the item of another customer with 404

  Expect: 404 Not Found, code ITEM_NOT_FOUND
  User: carol@example.com (token signed by scripts.py)
url: $CUSTOMER_APP_BASE_URL/items/100
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_carol
