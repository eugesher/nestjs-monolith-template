name: 05-key-too-long
description: |-
  e2e: Item › POST /api/items › should refuse a key of 129 characters with 400

  Expect: 400 Bad Request, code IDEMPOTENCY_KEY_INVALID, no item
  User: ann@example.com (token signed by scripts.py)
method: POST
url: $CUSTOMER_APP_BASE_URL/items
body:
  content: |-
    {
      "sku": "E2E-0005",
      "name": "Refused item"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_ann
