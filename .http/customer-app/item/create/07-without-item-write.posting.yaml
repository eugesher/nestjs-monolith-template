name: 07-without-item-write
description: |-
  e2e: Item › POST /api/items › should refuse a caller without item:write

  Expect: 403 Forbidden, Insufficient permissions
  User: viewer@example.com (token signed by scripts.py)
method: POST
url: $CUSTOMER_APP_BASE_URL/items
body:
  content: |-
    {
      "sku": "E2E-0006",
      "name": "Refused item"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-viewer-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_viewer
