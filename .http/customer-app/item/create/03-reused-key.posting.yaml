name: 03-reused-key
description: |-
  e2e: Item › POST /api/items › should refuse the same key with another body with 422

  Expect: 422 Unprocessable Entity, code ITEM_IDEMPOTENCY_KEY_REUSED
  User: editor@example.com (token signed by scripts.py)
  Before: send this request with the body {sku: E2E-0003, name: First body}: 201 Created
method: POST
url: $CUSTOMER_APP_BASE_URL/items
body:
  content: |-
    {
      "sku": "E2E-0004",
      "name": "Another body"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-reuse-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_editor
