name: 01-quoted-if-match
description: |-
  e2e: Item › PATCH /api/items/:itemId/name › should rename with a quoted If-Match and bump the version

  Expect: 200 OK, item 102 renamed at version 2
  User: ann@example.com (token signed by scripts.py)
method: PATCH
url: $CUSTOMER_APP_BASE_URL/items/102/name
body:
  content: |-
    {
      "name": "Renamed item"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '"1"'
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_ann
