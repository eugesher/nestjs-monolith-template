name: 04-foreign
description: |-
  e2e: Item › PATCH /api/items/:itemId/name › should hide the item of another customer from a rename with 404

  Expect: 404 Not Found, code ITEM_NOT_FOUND
  User: bob@example.com (token signed by scripts.py)
method: PATCH
url: $CUSTOMER_APP_BASE_URL/items/103/name
body:
  content: |-
    {
      "name": "Foreign rename"
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_bob
