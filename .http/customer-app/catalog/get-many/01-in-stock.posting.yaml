name: 01-in-stock
description: |-
  e2e: Catalog › GET /api/products › should list only the active products in stock, by id, with the quantity on hand

  Expect: 200 OK, products 100 (8 on hand) and 103 (3 on hand)
  User: bob@example.com (token signed by scripts.py)
  Before: Redis: DEL every acme:catalog:* key
url: $CUSTOMER_APP_BASE_URL/products
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_bob
