name: 05-size-zero
description: |-
  e2e: Catalog › GET /api/products › should refuse a size of zero with 400 from validation

  Expect: 400 Bad Request
  User: bob@example.com (token signed by scripts.py)
  Before: Redis: DEL every acme:catalog:* key
url: $CUSTOMER_APP_BASE_URL/products
params:
  - name: size
    value: '0'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_bob
