name: 04-reminders-not-mounted
description: |-
  e2e: should not mount the staff-app route /api/tools/reminders

  Expect: 404 Not Found
  User: bob@example.com (token signed by scripts.py)
url: $CUSTOMER_APP_BASE_URL/tools/reminders
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_bob
