name: 02-wrong-password
description: |-
  e2e: Auth › POST /api/auth/login › should refuse a wrong password with the same 401

  Expect: 401 Unauthorized, code AUTH_INVALID_CREDENTIALS
method: POST
url: $CUSTOMER_APP_BASE_URL/auth/login
body:
  content: |-
    {
      "email": "ann@example.com",
      "password": "wrong-password-123"
    }
headers:
  - name: Content-Type
    value: application/json
