name: 05-short-password
description: |-
  e2e: Auth › POST /api/auth/register › should refuse a password shorter than 12 with 400 from validation and store nothing

  Expect: 400 Bad Request, message "password must be longer than or equal to 12 characters", no new customer
method: POST
url: $CUSTOMER_APP_BASE_URL/auth/register
body:
  content: |-
    {
      "email": "frank@example.com",
      "password": "short-pass1"
    }
headers:
  - name: Content-Type
    value: application/json
