name: 01-register
description: |-
  e2e: Session › POST /api/auth/register › should create a customer who logs in and creates an item of their own

  Expect: 201 Created, {id, email} without a token; a customer row eve@example.com, active, with an argon2id hash
  Note: then log in as eve@example.com with the same password, GET /auth/me and POST /items (Idempotency-Key e2e-register-key) with that token: 200, 200 and 201 with owner_id = id
method: POST
url: $CUSTOMER_APP_BASE_URL/auth/register
body:
  content: |-
    {
      "email": "Eve@Example.com",
      "password": "eve-password-please-change"
    }
headers:
  - name: Content-Type
    value: application/json
