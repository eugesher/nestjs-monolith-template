name: 04-malformed-email
description: |-
  e2e: Session › POST /api/auth/register › should refuse a malformed email with 400 from validation and store nothing

  Expect: 400 Bad Request, message "email must be an email", no new customer
method: POST
url: $CUSTOMER_APP_BASE_URL/auth/register
body:
  content: |-
    {
      "email": "frank",
      "password": "frank-password-please-change"
    }
headers:
  - name: Content-Type
    value: application/json
