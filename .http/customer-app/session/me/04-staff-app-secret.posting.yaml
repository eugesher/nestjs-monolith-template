name: 04-staff-app-secret
description: |-
  e2e: Session › GET /api/auth/me › should refuse the token of a customer signed with the secret of staff-app

  Expect: 401 Unauthorized
  User: ann@example.com (token signed by scripts.py with the JWT_SECRET of staff-app)
url: $CUSTOMER_APP_BASE_URL/auth/me
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_ann_with_staff_secret
