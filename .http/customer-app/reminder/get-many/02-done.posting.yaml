name: 02-done
description: |-
  e2e: Reminder › GET /api/reminders › should filter by status

  Expect: 200 OK, reminder 302
  User: viewer@example.com (token signed by scripts.py)
url: $CUSTOMER_APP_BASE_URL/reminders
params:
  - name: status
    value: done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
