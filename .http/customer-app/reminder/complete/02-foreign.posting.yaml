name: 02-foreign
description: |-
  e2e: Reminder › PATCH /api/reminders/:reminderId/done › should refuse the reminder of another owner with 403

  Expect: 403 Forbidden, code REMINDER_ACCESS_FORBIDDEN
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $CUSTOMER_APP_BASE_URL/reminders/300/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
