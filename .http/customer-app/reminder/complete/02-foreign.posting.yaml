name: 02-foreign
description: |-
  e2e: Reminder › PATCH /api/reminders/:reminderId/done › should hide the reminder of another customer with 404

  Expect: 404 Not Found, code REMINDER_NOT_FOUND
  User: ann@example.com (token signed by scripts.py)
method: PATCH
url: $CUSTOMER_APP_BASE_URL/reminders/300/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_ann
