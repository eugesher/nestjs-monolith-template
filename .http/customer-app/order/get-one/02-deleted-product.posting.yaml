name: 02-deleted-product
description: |-
  e2e: Order › GET /api/orders/:orderId › should read an order of the caller with a product deleted after the order

  Expect: 200 OK, order 602 with line 603 of the soft-deleted product 107
  User: bob@example.com (token signed by scripts.py)
url: $CUSTOMER_APP_BASE_URL/orders/602
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_bob
