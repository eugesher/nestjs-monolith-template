name: 03-reused-key
description: |-
  e2e: Order › POST /api/orders › should refuse the same key with another body with 422

  Expect: 422 Unprocessable Entity, code ORDER_IDEMPOTENCY_KEY_REUSED, no second order
  User: ann@example.com (token signed by scripts.py)
  Note: send it first with "productIds": ["100"], which answers 201
method: POST
url: $CUSTOMER_APP_BASE_URL/orders
body:
  content: |-
    {
      "productIds": [
        "103"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-order-reuse-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_ann
