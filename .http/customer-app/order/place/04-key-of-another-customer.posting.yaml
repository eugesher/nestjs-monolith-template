name: 04-key-of-another-customer
description: |-
  e2e: Order › POST /api/orders › should place an order of another customer under the same key instead of refusing or replaying it

  Expect: 201 Created, a new order of carol with two lines of product 100; two completed idempotency_key rows under the key, scopes customer:101 and customer:103; a ledger record order-placed
  User: carol@example.com (token signed by scripts.py)
  Note: send place/01-place first
method: POST
url: $CUSTOMER_APP_BASE_URL/orders
body:
  content: |-
    {
      "productIds": [
        "100",
        "100"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Idempotency-Key
    value: e2e-order-place-key
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_carol
