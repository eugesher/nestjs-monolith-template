name: acme

services:
  mysql:
    image: mysql:9.7.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acme_db
      MYSQL_USER: acme
      MYSQL_PASSWORD: acmepass
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  redis:
    image: redis:8.10.3-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  client-api:
    build:
      context: .
      args:
        APP_NAME: client-api
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      ADMIN_API_PORT: 3001
      CLIENT_API_PORT: 3000
      API_PREFIX: api
      API_USE_API_REFERENCE: 'true'
      DATABASE_URL: mysql://acme:acmepass@mysql:3306/acme_db
      REDIS_URL: redis://redis:6379
      OCC_RETRY_ATTEMPTS: 5
      JWT_ACCESS_SECRET: development-access-secret-do-not-use-in-prod-32
      JWT_REFRESH_SECRET: development-refresh-secret-do-not-use-in-prod-32
      IDEMPOTENCY_KEY_TTL_HOURS: 24
      OTEL_SDK_DISABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    networks:
      - backend

  admin-api:
    build:
      context: .
      args:
        APP_NAME: admin-api
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
