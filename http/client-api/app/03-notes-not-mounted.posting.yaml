name: 03-notes-not-mounted
description: |-
  e2e: should not mount the admin-api route /api/notes

  Expect: 404 Not Found
  User: admin@example.com (token signed by scripts.py)
url: $CLIENT_API_BASE_URL/notes
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
