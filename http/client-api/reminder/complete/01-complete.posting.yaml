name: 01-complete
description: |-
  e2e: Reminder › PATCH /api/reminders/:reminderId/done › should complete a reminder and drop the cached summary

  Expect: 200 OK, reminder 301 done at version 2; the summary key is gone
  User: viewer@example.com (token signed by scripts.py)
  Before: Redis: FLUSHDB
  Before: send reminder/get-summary/01-compute-and-cache
method: PATCH
url: $CLIENT_API_BASE_URL/reminders/301/done
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
