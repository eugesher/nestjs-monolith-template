name: 01-editor
description: |-
  e2e: Session › POST /api/auth/login › should issue an access token the guards accept and a refresh token

  Expect: 200 OK, accessToken and refreshToken
  Note: the tokens are saved to the session variables access_token and refresh_token
method: POST
url: $CLIENT_API_BASE_URL/auth/login
body:
  content: |-
    {
      "email": "editor@example.com",
      "password": "editor-password-please-change"
    }
headers:
  - name: Content-Type
    value: application/json
scripts:
  on_response: scripts.py:capture_login
