name: 01-archive
description: |-
  e2e: Item › PATCH /api/items/:itemId/archive › should archive and record one ledger entry under the correlation id

  Expect: 200 OK, item 103 archived at version 2, one ledger entry item-archived:103 with correlation_id e2e-item-archive
  User: editor@example.com (token signed by scripts.py)
method: PATCH
url: $CLIENT_API_BASE_URL/items/103/archive
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: If-Match
    value: '1'
  - name: x-correlation-id
    value: e2e-item-archive
scripts:
  setup: scripts.py:as_editor
