name: 02-every-owner
description: |-
  e2e: Item › GET /api/items › should list the items of every owner to an admin, newest first

  Expect: 200 OK, items 106 to 100
  User: admin@example.com (token signed by scripts.py)
url: $CLIENT_API_BASE_URL/items
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
