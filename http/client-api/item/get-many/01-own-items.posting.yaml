name: 01-own-items
description: |-
  e2e: Item › GET /api/items › should list only the own items of a caller who is not an admin

  Expect: 200 OK, item 106
  User: viewer@example.com (token signed by scripts.py)
url: $CLIENT_API_BASE_URL/items
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
