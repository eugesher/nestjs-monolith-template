name: 02-foreign
description: |-
  e2e: Item › GET /api/items/:itemId › should refuse the item of another owner to a caller who is not an admin

  Expect: 403 Forbidden, code ITEM_ACCESS_FORBIDDEN
  User: viewer@example.com (token signed by scripts.py)
url: $CLIENT_API_BASE_URL/items/100
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_viewer
