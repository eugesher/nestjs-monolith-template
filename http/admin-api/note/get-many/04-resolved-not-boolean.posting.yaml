name: 04-resolved-not-boolean
description: |-
  e2e: Note › GET /api/notes › should refuse a resolution that is not a boolean with 400 from validation

  Expect: 400 Bad Request, resolved must be a boolean value
  User: editor@example.com (token signed by scripts.py)
url: $ADMIN_API_BASE_URL/notes
params:
  - name: resolved
    value: 'yes'
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_editor
