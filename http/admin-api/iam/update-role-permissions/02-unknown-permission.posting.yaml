name: 02-unknown-permission
description: |-
  e2e: Iam › PUT /api/iam/roles/:role/permissions › should refuse an unknown permission code with 400

  Expect: 400 Bad Request from validation, permissions unchanged
  User: admin@example.com (token signed by scripts.py)
method: PUT
url: $ADMIN_API_BASE_URL/iam/roles/viewer/permissions
body:
  content: |-
    {
      "permissionCodes": [
        "item:read",
        "item:delete"
      ]
    }
auth:
  type: bearer_token
  bearer_token:
    token: $token
headers:
  - name: Content-Type
    value: application/json
scripts:
  setup: scripts.py:as_admin
