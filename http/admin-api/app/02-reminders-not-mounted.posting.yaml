name: 02-reminders-not-mounted
description: |-
  e2e: should not mount the client-api route /api/reminders

  Expect: 404 Not Found
  User: admin@example.com (token signed by scripts.py)
url: $ADMIN_API_BASE_URL/reminders
auth:
  type: bearer_token
  bearer_token:
    token: $token
scripts:
  setup: scripts.py:as_admin
